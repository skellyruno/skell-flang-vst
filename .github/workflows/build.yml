name: Build Skell-Flang Windows VST3 Only
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
# A newer commit supersedes earlier heavy MSVC builds while iterating.
concurrency:
  group: skell-flang-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64 -DSKELLFLANG_BUILD_UI_SMOKE=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Validate manifest and package
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Directory -Recurse -Filter '*.vst3' | Where-Object { $_.FullName -like '*SkellFlang*' } | Select-Object -First 1
          if (-not $vst) { throw 'Skell-Flang VST3 not built' }
          $binary = Join-Path $vst.FullName 'Contents/x86_64-win/Skell-Flang.vst3'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'VST3 x64 module binary missing' }
          $manifest = Join-Path $vst.FullName 'Contents/Resources/moduleinfo.json'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'VST3 manifest is missing' }
          $contents = Get-Content -LiteralPath $manifest -Raw
          # Some JUCE 8 manifests contain JSON trailing commas; normalize and validate.
          $normalized = $contents -replace ',(?=\s*[}\]])', ''
          $metadata = $normalized | ConvertFrom-Json -ErrorAction Stop
          if ($metadata.Name -ne 'Skell-Flang') { throw 'Unexpected VST3 product identity' }
          Set-Content -LiteralPath $manifest -Value $normalized -Encoding utf8 -NoNewline
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $vst.FullName -Destination dist -Recurse -Force
      - name: Exercise real JUCE editor at four sizes and render test snapshots
        shell: pwsh
        run: |
          $test = Get-ChildItem build -Recurse -File -Filter '*UiSmoke.exe' | Select-Object -First 1
          if (-not $test) { throw 'UI smoke test program was not built' }
          & $test.FullName
          if ($LASTEXITCODE -ne 0) { throw "UI smoke test failed (exit $LASTEXITCODE)" }
      - name: Save real editor renders for layout inspection
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Skell-Flang-UI-Renders
          path: build/ui-smoke/*.png
          if-no-files-found: ignore
      - name: Host and editor validation (pluginval)
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: build/SkellFlang_artefacts/Release/VST3/Skell-Flang.vst3
          strictness-level: 5
          args: --timeout-ms 90000
          pluginval-version: v2.0.0-beta3
      - uses: actions/upload-artifact@v6
        with:
          name: Skell-Flang-Windows-VST3-Only
          path: dist/
          if-no-files-found: error
  portable-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure DSP tests
        run: cmake -S tests -B build-dsp -DCMAKE_BUILD_TYPE=Release
      - name: Build DSP tests
        run: cmake --build build-dsp --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build-dsp --output-on-failure
      - name: Measure 8-voice and morph CPU on runner
        run: ./build-dsp/flang-dsp-bench
  portable-dsp-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure address and undefined behavior sanitizers
        run: cmake -S tests -B build-san -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized tests
        run: cmake --build build-san --parallel 2
      - name: Run sanitized tests
        run: ctest --test-dir build-san --output-on-failure
